# Supabase local development configuration.
# Docs: https://supabase.com/docs/guides/local-development

project_id = "bible-verses-understood"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "http://localhost:4173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
enable_confirmations = false
double_confirm_changes = true
secure_password_change = true

# Optional Google sign-in. Set the secrets in your environment before enabling.
[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
redirect_uri = ""
skip_nonce_check = false

[analytics]
enabled = false

# Edge Functions. `verify_jwt = false` because Scripture study works without an
# account; each function still authenticates the caller when a token is present.
[functions.study]
verify_jwt = false

[functions.followup]
verify_jwt = false

[functions.devotional]
verify_jwt = false

[functions.situation]
verify_jwt = false

[functions.scripture]
verify_jwt = false
